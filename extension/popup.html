<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    width: 260px;
    padding: 18px 18px 16px;
    background: #1d1733;
    color: #ece9f5;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    color: #b9b1d6;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #label { font-size: 15px; font-weight: 600; }
  .switch { position: relative; width: 50px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #3a3356;
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    left: 3px; top: 3px;
    border-radius: 50%;
    background: #ece9f5;
    transition: transform .18s ease;
  }
  input:checked + .slider { background: #3aa65c; }
  input:checked + .slider::before { transform: translateX(22px); }

  hr {
    border: 0;
    border-top: 1px solid #332b52;
    margin: 16px 0 14px;
  }
  label.field {
    display: block;
    font-size: 11px;
    letter-spacing: .05em;
    color: #b9b1d6;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #3a3356;
    background: #14102a;
    color: #ece9f5;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input[type=text]:focus { outline: none; border-color: #6de0a0; }
  button {
    margin-top: 10px;
    width: 100%;
    padding: 9px;
    border: 0;
    border-radius: 8px;
    background: #3aa65c;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #45bd6b; }
  #hint {
    margin: 12px 0 0;
    font-size: 11px;
    line-height: 1.5;
    color: #8e86ad;
  }
  #hint a { color: #9be0b5; }
  #saved { color: #6de0a0; }
</style>
</head>
<body>
  <h1>YTM → DISCORD</h1>

  <div class="row">
    <span id="label">Трансляция</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <hr>

  <label class="field" for="clientId">DISCORD APPLICATION ID</label>
  <input type="text" id="clientId" placeholder="1234567890123456789" spellcheck="false">
  <button id="save">Сохранить</button>

  <p id="hint">
    Создай приложение на
    <a href="https://discord.com/developers/applications" target="_blank">developers</a>
    и вставь Application ID. Имя приложения появится в статусе.
  </p>
</body>
<script src="popup.js"></script>
</html>
